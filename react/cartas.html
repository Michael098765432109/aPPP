<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cartas y mensajes — Para Alexandra</title>
  <meta
    name="description"
    content="Seis cartas y pequeños apartados escritos con cariño para Alexandra. Ábrelos cuando quieras; nada aquí pide una respuesta."
  />
  <meta name="theme-color" content="#be185d" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="16x16" href="./icons/favicon-16.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png" />
  <script>
    (function () {
      var root = document.documentElement;
      root.classList.add("js");
      try {
        var saved = localStorage.getItem("alexandra-theme");
        if (saved === "light" || saved === "night") root.dataset.theme = saved;
      } catch (error) {}
    })();
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="./src/entries/cartas.jsx"></script>
</body>
</html>
